server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Resolve "api" through Docker's DNS at request time (not only at startup), so a rebuilt
    # api container with a new IP does not leave the panel answering 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
    location = /docs         { proxy_pass $api_upstream; }
    location = /openapi.json { proxy_pass $api_upstream; }
    location = /health       { proxy_pass $api_upstream; }

    # Hashed assets can be cached; index.html must be revalidated so a rebuilt UI shows up on reload.
    # (add_header inside a location replaces the server-level ones, so they are repeated here.)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
}
